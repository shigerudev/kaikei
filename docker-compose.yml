# Local runtime: postgres + seaweedfs (S3 object store) + engine. The UI runs on the host with `npm run dev`.
# Postgres publishes no port: it is reachable only on the internal `backend` network.
# SeaweedFS (S3 auth required, no anonymous access) publishes only its S3 port, on loopback
# (127.0.0.1:8333), for a host-run engine and debugging. Master/volume/filer stay internal.
# The engine publishes 8000 on loopback only, for the host-run UI and curl.
name: kaikei

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kaikei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kaikei}
      POSTGRES_DB: ${POSTGRES_DB:-kaikei}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.85
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kaikei}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kaikei-local-secret}
    # Identities are generated from env at start; the s3 gateway then rejects unsigned requests.
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"kaikei","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    networks: [backend]
    healthcheck:
      # 403 from an unsigned S3 request still proves the gateway is listening.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  seaweedfs-init:
    image: chrislusf/seaweedfs:3.85
    restart: "no"
    environment:
      S3_BUCKET: ${S3_BUCKET:-kaikei-originals}
    # Idempotent: creates the bucket only if `s3.bucket.list` does not show it.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        if echo "s3.bucket.list" | weed shell -master=seaweedfs:9333 2>/dev/null | grep -qw "$$S3_BUCKET"; then
          echo "bucket $$S3_BUCKET exists"
        else
          echo "s3.bucket.create -name $$S3_BUCKET" | weed shell -master=seaweedfs:9333
        fi
    networks: [backend]
    depends_on:
      seaweedfs:
        condition: service_healthy

  engine:
    image: ghcr.io/astral-sh/uv:0.11.2-python3.12-trixie-slim
    working_dir: /app
    command: ["uv", "run", "fastapi", "dev", "kaikei/main.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-kaikei}:${POSTGRES_PASSWORD:-kaikei}@postgres:5432/${POSTGRES_DB:-kaikei}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kaikei}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kaikei-local-secret}
      S3_BUCKET: ${S3_BUCKET:-kaikei-originals}
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_CACHE_DIR: /opt/uv-cache
      UV_LINK_MODE: copy
    volumes:
      - ./engine:/app
      - ./fixtures:/fixtures:ro
      - engine-venv:/opt/venv
      - uv-cache:/opt/uv-cache
    ports:
      - "127.0.0.1:${ENGINE_PORT:-8000}:8000"
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  backend:

volumes:
  pgdata:
  seaweedfs-data:
  engine-venv:
  uv-cache:
