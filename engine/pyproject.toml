[project]
name = "kaikei"
version = "0.1.0"
description = "Kaikei consolidation engine (Grupo AG)"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "boto3>=1.44.9",
  "fastapi[standard]>=0.115",
  "psycopg[binary]>=3.3.9",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.1.9",
]

[project.optional-dependencies]
dev = [
  "moto[s3]>=5.2.5",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kaikei"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
